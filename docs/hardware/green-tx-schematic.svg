<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1750 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e7d32"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3781f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1750" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111">RP2040-Zero to Vista-20P bus interface: complete circuit</text>
  <text x="20" y="50" font-size="13" fill="#555">Board silhouette/pin layout matches the Waveshare RP2040-Zero pinout reference photo. All three signal circuits plus the panel's own bus terminals.</text>

  <g transform="translate(120,0)">
  <!-- ================= RP2040-Zero board ================= -->
  <g>
    <rect x="60" y="90" width="220" height="430" rx="18" fill="#173d73" stroke="#0d2648" stroke-width="2"/>
    <rect x="140" y="90" width="60" height="26" rx="6" fill="#c7ccd1" stroke="#8a9096" stroke-width="1.5"/>
    <text x="170" y="82" font-size="11" text-anchor="middle" fill="#333">USB-C</text>
    <text x="170" y="150" font-size="12" text-anchor="middle" fill="#dfe8f7" font-weight="bold">RP2040-Zero</text>
    <rect x="130" y="230" width="80" height="80" rx="6" fill="#0d2648"/>
    <text x="170" y="274" font-size="10" text-anchor="middle" fill="#7fa0d8">RP2040</text>
    <circle cx="95" cy="330" r="9" fill="#e9e9e9" stroke="#888"/>
    <text x="95" y="352" font-size="9" text-anchor="middle" fill="#dfe8f7">BOOT</text>
    <circle cx="245" cy="330" r="9" fill="#e9e9e9" stroke="#888"/>
    <text x="245" y="352" font-size="9" text-anchor="middle" fill="#dfe8f7">RESET</text>
  </g>

  <!-- Left column pins -->
  <g font-size="13">
    <circle cx="60" cy="112" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="0" y1="112" x2="55" y2="112" stroke="#888" stroke-width="1.5"/>
    <text x="0" y="108" text-anchor="start" fill="#888">5V</text>

    <!-- GND: jogs off the GP1 row, then routes all the way to the shared
         GND bus on the right (see below) -->
    <circle cx="60" cy="150" r="6" fill="#1e7d32" stroke="#123f19" stroke-width="1.5"/>
    <polyline points="60,150 40,150 40,172 -95,172 -95,650 450,650 450,260"
               fill="none" stroke="#1e7d32" stroke-width="2.5"/>
    <text x="-10" y="167" text-anchor="start" fill="#1e7d32" font-weight="bold">GND</text>

    <circle cx="60" cy="188" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="0" y1="188" x2="55" y2="188" stroke="#888" stroke-width="1.5"/>
    <text x="0" y="184" text-anchor="start" fill="#888">3V3</text>

    <circle cx="60" cy="226" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="0" y1="226" x2="55" y2="226" stroke="#888" stroke-width="1.5"/>
    <text x="0" y="222" text-anchor="start" fill="#888">GP29</text>

    <!-- GP28: Green bus-monitor tap. Routes under the board, well clear
         of the board's right edge (x=280), up to its own 33k/10k divider
         at x=500. See Lane B below. -->
    <circle cx="60" cy="264" r="5.5" fill="#2a6fb0" stroke="#123a5c" stroke-width="1.5"/>
    <polyline points="60,264 -70,264 -70,690 470,690 470,460"
               fill="none" stroke="#2a6fb0" stroke-width="2"/>
    <text x="-70" y="260" text-anchor="start" fill="#2a6fb0">GP28 (Green monitor tap)</text>

    <circle cx="60" cy="302" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="-42" y1="302" x2="55" y2="302" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="-42" y="298" text-anchor="start" fill="#999">GP27 (dead, unused)</text>

    <!-- GP26: Yellow RX. Routes under the board, well clear of the
         board's right edge, up to its own 39k/10k divider at x=560,
         staggered right of and lower than GP28's. See Lane C below. -->
    <circle cx="60" cy="340" r="5.5" fill="#c8952a" stroke="#7a5a15" stroke-width="1.5"/>
    <polyline points="60,340 -58,340 -58,730 530,730 530,600"
               fill="none" stroke="#c8952a" stroke-width="2"/>
    <text x="-58" y="336" text-anchor="start" fill="#a3781f">GP26 (Yellow RX)</text>

    <circle cx="60" cy="378" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="0" y1="378" x2="55" y2="378" stroke="#888" stroke-width="1.5"/>
    <text x="0" y="374" text-anchor="start" fill="#888">GP15</text>

    <circle cx="60" cy="416" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="0" y1="416" x2="55" y2="416" stroke="#888" stroke-width="1.5"/>
    <text x="0" y="412" text-anchor="start" fill="#888">GP14</text>
  </g>

  <!-- Right column pins -->
  <g font-size="13">
    <circle cx="280" cy="112" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="285" y1="112" x2="330" y2="112" stroke="#888" stroke-width="1.5"/>
    <text x="335" y="108" text-anchor="start" fill="#888">GP0</text>

    <circle cx="280" cy="150" r="6.5" fill="#222" stroke="#000" stroke-width="1.8"/>
    <line x1="285" y1="150" x2="380" y2="150" stroke="#222" stroke-width="3"/>
    <text x="335" y="140" text-anchor="start" fill="#111" font-weight="bold" font-size="15">GP1</text>
    <text x="335" y="158" text-anchor="start" fill="#333" font-size="11">(Green TX)</text>

    <circle cx="280" cy="188" r="5" fill="#cfcfcf" stroke="#666"/>
    <line x1="285" y1="188" x2="330" y2="188" stroke="#888" stroke-width="1.5"/>
    <text x="335" y="192" text-anchor="start" fill="#999" font-size="12">GP2 - GP13 (unused)</text>
  </g>

  <!-- ================= Lane A: Green TX (GP1 -> R_B -> D1 -> Q1) ================= -->
  <line x1="380" y1="150" x2="450" y2="150" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>

  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="450,150 458,138 468,162 478,138 488,162 498,138 508,150"/>
  </g>
  <text x="478" y="122" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">R_B</text>
  <text x="478" y="106" font-size="11" text-anchor="middle" fill="#555">1k&#937;</text>

  <line x1="508" y1="150" x2="560" y2="150" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g stroke="#222" stroke-width="2.5" fill="none">
    <polygon points="560,138 560,162 590,150"/>
    <line x1="590" y1="138" x2="590" y2="162"/>
  </g>
  <text x="575" y="118" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">D1 -- 1N4148</text>

  <line x1="605" y1="150" x2="660" y2="150" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g stroke="#222" stroke-width="2" fill="none">
    <line x1="660" y1="150" x2="690" y2="150"/>
    <line x1="690" y1="120" x2="690" y2="180"/>
    <line x1="690" y1="132" x2="720" y2="105"/>
    <line x1="690" y1="168" x2="720" y2="195"/>
    <polygon points="712,190 720,195 715,183" fill="#222" stroke="none"/>
  </g>
  <text x="700" y="145" font-size="12" fill="#222" font-weight="bold">Q1</text>
  <text x="700" y="70" font-size="12" text-anchor="middle" fill="#222" font-weight="bold">2N2222</text>
  <text x="722" y="100" font-size="11" fill="#555">collector</text>
  <text x="722" y="210" font-size="11" fill="#555">emitter</text>
  <text x="655" y="140" font-size="10.5" fill="#555" text-anchor="end">base</text>

  <!-- collector -> GREEN bus, all the way to the panel terminal -->
  <line x1="720" y1="105" x2="720" y2="70" stroke="#222" stroke-width="2.5"/>
  <line x1="720" y1="70" x2="1250" y2="70" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- emitter -> GND bus -->
  <line x1="720" y1="195" x2="720" y2="260" stroke="#222" stroke-width="2.5"/>
  <line x1="720" y1="260" x2="450" y2="260" stroke="#222" stroke-width="2.5"/>
  <text x="585" y="278" font-size="11.5" text-anchor="middle" fill="#555">Q1 emitter -&gt; GND bus</text>

  <!-- ================= Shared GND bus (x=450, y=260 to 640) ================= -->
  <!-- Everything ground-referenced taps this one vertical bus: Q1's
       emitter and the physical GND pin's wire at the top, the two
       divider bottom-resistors partway down, and the panel's BLACK
       terminal branching off partway down too. -->
  <line x1="450" y1="260" x2="450" y2="640" stroke="#1e7d32" stroke-width="3"/>
  <circle cx="450" cy="260" r="5" fill="#1e7d32"/>

  <!-- branch to panel BLACK (GND) terminal -->
  <circle cx="450" cy="345" r="4.5" fill="#1e7d32"/>
  <line x1="450" y1="345" x2="1250" y2="345" stroke="#1e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="700" y="335" font-size="11.5" text-anchor="middle" fill="#1e7d32" font-weight="bold">dedicated GND wire (RP2040 GND -&gt; Panel GND)</text>

  <!-- branch to GP28 divider's bottom resistor -->
  <circle cx="450" cy="500" r="4.5" fill="#1e7d32"/>

  <!-- ================= Lane B: Green bus-monitor divider (GP28) ================= -->
  <!-- Divider node at x=500, well clear of the board's right edge
       (x=280) so no label or component overlaps the board silhouette. -->
  <line x1="470" y1="460" x2="500" y2="460" stroke="#2a6fb0" stroke-width="2"/>
  <circle cx="500" cy="460" r="4" fill="#2a6fb0"/>
  <text x="500" y="400" font-size="11" text-anchor="middle" fill="#2a6fb0">Green bus-monitor</text>
  <text x="500" y="414" font-size="11" text-anchor="middle" fill="#2a6fb0">divider (GP28)</text>
  <!-- R_top (33k), node -> up to the shared Green bus -->
  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="500,460 508,448 492,436 508,424 500,412"/>
  </g>
  <text x="516" y="440" font-size="11" text-anchor="start" fill="#555">33k&#937;</text>
  <line x1="500" y1="412" x2="500" y2="70" stroke="#2a6fb0" stroke-width="2"/>
  <line x1="500" y1="70" x2="1250" y2="70" stroke="#2a6fb0" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- R_bottom (10k), node -> down to GND bus -->
  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="500,460 508,472 492,484 508,496 500,508"/>
  </g>
  <text x="516" y="485" font-size="11" text-anchor="start" fill="#555">10k&#937;</text>
  <line x1="500" y1="508" x2="500" y2="500" stroke="#2a6fb0" stroke-width="2"/>
  <line x1="500" y1="500" x2="450" y2="500" stroke="#2a6fb0" stroke-width="2"/>

  <!-- branch to GP26 divider's bottom resistor -->
  <circle cx="450" cy="640" r="4.5" fill="#1e7d32"/>

  <!-- ================= Lane C: Yellow RX divider (GP26) ================= -->
  <!-- Divider node at x=560, y=600, staggered right of and well below
       GP28's divider so the two don't visually collide. -->
  <line x1="530" y1="600" x2="560" y2="600" stroke="#c8952a" stroke-width="2"/>
  <circle cx="560" cy="600" r="4" fill="#c8952a"/>
  <text x="560" y="540" font-size="11" text-anchor="middle" fill="#a3781f">Yellow RX divider (GP26)</text>
  <!-- R_top (39k), node -> up to the shared Yellow bus -->
  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="560,600 568,588 552,576 568,564 560,552"/>
  </g>
  <text x="576" y="580" font-size="11" text-anchor="start" fill="#555">39k&#937;</text>
  <line x1="560" y1="552" x2="560" y2="460" stroke="#c8952a" stroke-width="2"/>
  <line x1="560" y1="460" x2="1250" y2="460" stroke="#c8952a" stroke-width="2" marker-end="url(#arrowGold)"/>
  <!-- R_bottom (10k), node -> down to GND bus -->
  <g stroke="#222" stroke-width="2" fill="none">
    <polyline points="560,600 568,612 552,624 568,636 560,648"/>
  </g>
  <text x="576" y="625" font-size="11" text-anchor="start" fill="#555">10k&#937;</text>
  <line x1="560" y1="648" x2="560" y2="640" stroke="#c8952a" stroke-width="2"/>
  <line x1="560" y1="640" x2="450" y2="640" stroke="#c8952a" stroke-width="2"/>

  <!-- ================= Vista-20P panel terminal block ================= -->
  <rect x="1250" y="40" width="220" height="480" rx="10" fill="#2b2b2b" stroke="#000" stroke-width="2"/>
  <text x="1360" y="26" font-size="14" text-anchor="middle" fill="#111" font-weight="bold">Vista-20P keypad bus</text>
  <text x="1360" y="500" font-size="10.5" text-anchor="middle" fill="#eee">4-conductor bus, non-isolated tap</text>

  <circle cx="1250" cy="70" r="6" fill="#1e7d32" stroke="#0d3d13" stroke-width="1.5"/>
  <text x="1265" y="65" font-size="13" fill="#eafbea" font-weight="bold">GREEN</text>
  <text x="1265" y="80" font-size="10.5" fill="#c9e8c9">keypad data in (TX + monitor)</text>

  <circle cx="1250" cy="150" r="6" fill="#888" stroke="#444" stroke-width="1.5"/>
  <text x="1265" y="145" font-size="13" fill="#ccc" font-weight="bold">RED</text>
  <text x="1265" y="160" font-size="10.5" fill="#999">+12V AUX -- not connected</text>
  <text x="1265" y="173" font-size="10.5" fill="#999">(RP2040 is USB-powered)</text>

  <circle cx="1250" cy="345" r="6" fill="#1e7d32" stroke="#0d3d13" stroke-width="1.5"/>
  <text x="1265" y="340" font-size="13" fill="#eafbea" font-weight="bold">BLACK</text>
  <text x="1265" y="355" font-size="10.5" fill="#c9e8c9">GND</text>

  <circle cx="1250" cy="460" r="6" fill="#c8952a" stroke="#5c4310" stroke-width="1.5"/>
  <text x="1265" y="455" font-size="13" fill="#f6e6c0" font-weight="bold">YELLOW</text>
  <text x="1265" y="470" font-size="10.5" fill="#d9c290">panel data out</text>

  <!-- ================= Legend ================= -->
  <g font-size="12.5">
    <text x="60" y="740" font-weight="bold" fill="#111">Legend</text>

    <line x1="60" y1="758" x2="100" y2="758" stroke="#222" stroke-width="2.5"/>
    <text x="108" y="762" fill="#222">Green TX signal path (RP2040 to Green)</text>

    <line x1="380" y1="758" x2="420" y2="758" stroke="#1e7d32" stroke-width="3"/>
    <text x="428" y="762" fill="#1e7d32">Ground bus (physical GND pin, Q1 emitter, both dividers, Panel GND)</text>

    <line x1="920" y1="758" x2="960" y2="758" stroke="#2a6fb0" stroke-width="2.5"/>
    <text x="968" y="762" fill="#2a6fb0">Green bus-monitor path (GP28)</text>

    <line x1="1250" y1="758" x2="1290" y2="758" stroke="#c8952a" stroke-width="2.5"/>
    <text x="1298" y="762" fill="#a3781f">Yellow RX path (GP26)</text>

    <circle cx="60" cy="778" r="5" fill="#cfcfcf" stroke="#666"/>
    <text x="75" y="782" fill="#777">Unused / not part of this circuit</text>
  </g>
  </g>
</svg>
