<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Vista Panel Tool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #14161a; color: #e8eaed; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 16px 20px; background: #1c1f26; border-bottom: 1px solid #2a2e37; }
  h1 { font-size: 18px; margin: 0; }
  main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .screen.hidden { display: none; }
  .screen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .screen-header h2 { margin: 0; font-size: 16px; }
  .tool-grid { display: flex; flex-direction: column; gap: 12px; }
  .tool-card {
    display: block; width: 100%; text-align: left; background: #1c1f26; border: 1px solid #2a2e37;
    border-radius: 10px; padding: 18px; color: #e8eaed; font-size: 16px; font-weight: 600; min-height: 0;
  }
  .tool-card .sub { display: block; font-weight: 400; font-size: 13px; color: #9aa0a8; margin-top: 4px; }
  .tool-card:disabled { opacity: 0.4; }
  #homeScreen .tool-card { margin-bottom: 20px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .next-row { display: flex; justify-content: flex-end; margin-top: 20px; }
  input[type=text], input[type=password], select {
    background: #1c1f26; border: 1px solid #2a2e37; color: #e8eaed;
    padding: 12px 14px; border-radius: 8px; font-size: 16px; flex: 1; min-width: 140px;
  }
  label { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  button {
    background: #3a7bd5; color: white; border: none; border-radius: 8px;
    padding: 14px 20px; font-size: 16px; font-weight: 600; min-height: 48px;
  }
  button:disabled { opacity: 0.5; }
  button.stop { background: #d5453a; }
  button.save { background: #2f9e58; }
  button.ghost {
    background: transparent; border: 1px solid #2a2e37; color: #9aa0a8;
    padding: 10px 14px; font-size: 14px; font-weight: 500; min-height: 40px;
  }
  #progressbar { height: 8px; background: #2a2e37; border-radius: 4px; overflow: hidden; margin: 14px 0; }
  #progressbar > div { height: 100%; background: #3a7bd5; width: 0%; transition: width 0.2s; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2e37; }
  th { color: #9aa0a8; font-weight: 500; font-size: 13px; text-transform: uppercase; }
  #status, #toolsStatus, #siteListStatus { color: #9aa0a8; font-size: 14px; margin-bottom: 8px; min-height: 20px; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<header><h1>Vista Panel Tool</h1></header>
<main>

  <div id="homeScreen" class="screen">
    <button class="tool-card" onclick="openLoadSite()">
      Load previous site
      <span class="sub">Pick up a site's saved data from a past visit</span>
    </button>
    <div class="form-row">
      <select id="panelType">
        <option value="20P">Vista-20P</option>
        <option value="21IP">Vista-21IP (built-in radio, programs identically)</option>
      </select>
    </div>
    <div class="form-row">
      <input id="installerCode" type="password" placeholder="Installer code" inputmode="numeric" oninput="updateNextEnabled()">
      <button id="backdoorBtn" type="button" onclick="useBackdoorCode()">I don't know / attempt back door</button>
    </div>
    <div class="next-row">
      <button id="nextBtn" onclick="showScreen('toolsScreen')" disabled>Next &rarr;</button>
    </div>
  </div>

  <div id="loadSiteScreen" class="screen hidden">
    <div class="screen-header">
      <button class="ghost" type="button" onclick="showScreen('homeScreen')">&larr; Back</button>
      <h2>Load Previous Site</h2>
    </div>
    <div id="siteListStatus"></div>
    <div id="siteList" class="tool-grid"></div>
  </div>

  <div id="toolsScreen" class="screen hidden">
    <div class="screen-header">
      <button class="ghost" type="button" onclick="showScreen('homeScreen')">&larr; Back</button>
      <h2>Tools</h2>
    </div>
    <div class="form-row">
      <button id="saveSiteBtn" class="save" onclick="saveSite()">Save Site</button>
      <input id="siteNameInput" type="text" placeholder="Site name">
    </div>
    <div id="toolsStatus"></div>
    <div class="tool-grid">
      <button class="tool-card" onclick="showScreen('scanScreen')">
        Zone Discovery
        <span class="sub">Read zone types &amp; names</span>
      </button>
      <button class="tool-card" disabled>
        Write Configuration
        <span class="sub">Coming soon — edit a saved scan and send it back to the panel</span>
      </button>
      <button class="tool-card" disabled>
        Reports
        <span class="sub">Coming soon — turn a saved scan into a CSV/PDF report</span>
      </button>
    </div>
  </div>

  <div id="scanScreen" class="screen hidden">
    <div class="screen-header">
      <button class="ghost" type="button" onclick="goToTools()">&larr; Back</button>
      <h2>Zone Discovery</h2>
    </div>
    <div class="form-row">
      <label><input id="readTypes" type="checkbox" checked> Zone types</label>
      <label><input id="readNames" type="checkbox"> Zone names (re-saves each one)</label>
    </div>
    <div class="form-row">
      <button id="startBtn" onclick="startScan()">Start Scan</button>
      <button id="stopBtn" class="stop" onclick="stopScan()" disabled>Stop</button>
      <button id="saveBtn" class="save" onclick="saveScan()" disabled>Save</button>
    </div>
    <div id="status"></div>
    <div id="progressbar"><div id="progressfill"></div></div>
    <table>
      <thead><tr><th>Zone</th><th>Type</th><th>Name</th></tr></thead>
      <tbody id="results"></tbody>
    </table>
  </div>

</main>
<script>
let ws = null;
// Which saved site (if any) the current data came from/should update. Blank
// means "new site, not saved under a name yet".
let currentSiteName = '';
// Scan results collected as they stream in (or loaded from a saved site),
// keyed by zone number. This is the seam between "read" and the things
// reading is actually for: loading back into a future write-mode editor,
// exporting as a report, or persisting under a site name for next visit
// (see saveScan()/saveSite() below and CONCEPT.md "Software scope: read/write").
const results = {};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach((el) => el.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function goToTools() {
  if (ws) stopScan();
  showScreen('toolsScreen');
}

function updateNextEnabled() {
  document.getElementById('nextBtn').disabled = !document.getElementById('installerCode').value.trim();
}

// Ademco/Honeywell Vista installer default code -- programs identically on
// 20P and 21IP (21IP just adds a built-in radio). For techs who don't have
// the site's actual installer code on hand.
const BACKDOOR_INSTALLER_CODE = '4112';

function useBackdoorCode() {
  document.getElementById('installerCode').value = BACKDOOR_INSTALLER_CODE;
  updateNextEnabled();
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function clearResults() {
  document.getElementById('results').innerHTML = '';
  for (const zone of Object.keys(results)) delete results[zone];
}

function row(zone) {
  let tr = document.getElementById('row-' + zone);
  if (!tr) {
    tr = document.createElement('tr');
    tr.id = 'row-' + zone;
    tr.innerHTML = `<td>${zone}</td><td class="type"></td><td class="name"></td>`;
    document.getElementById('results').appendChild(tr);
  }
  return tr;
}

function startScan() {
  const code = document.getElementById('installerCode').value.trim();
  if (!code) { setStatus('Enter the installer code first.', true); return; }
  clearResults();
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  document.getElementById('saveBtn').disabled = true;
  setStatus('Connecting…');

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/scan`);
  ws.onopen = () => {
    ws.send(JSON.stringify({
      installer_code: code,
      panel_type: document.getElementById('panelType').value,
      read_types: document.getElementById('readTypes').checked,
      read_names: document.getElementById('readNames').checked,
    }));
    setStatus('Scanning…');
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.kind === 'progress') {
      if (msg.stage === 'error') { setStatus(msg.message, true); finishScan(); return; }
      if (msg.stage === 'done') { setStatus('Scan complete.'); finishScan(); return; }
      const pct = msg.total_zones ? Math.round(((msg.zone || 0) / msg.total_zones) * 100) : 0;
      document.getElementById('progressfill').style.width = pct + '%';
      setStatus(`Reading zone ${msg.zone} of ${msg.total_zones} (${msg.stage})…`);
    } else if (msg.kind === 'zone') {
      results[msg.zone] = msg;
      document.getElementById('saveBtn').disabled = false;
      const tr = row(msg.zone);
      if (msg.zone_type_label) tr.querySelector('.type').textContent = msg.zone_type_label;
      if (msg.name) tr.querySelector('.name').textContent = msg.name;
    }
  };
  ws.onerror = () => setStatus('Connection error.', true);
  ws.onclose = () => finishScan();
}

function stopScan() { if (ws) ws.close(); finishScan(); }
function finishScan() {
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}
function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

function csvEscape(value) {
  const s = String(value);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// Saves the scan as a CSV report -- the same zone/type/name data this UI
// would eventually let a tech reload for write-mode editing (once that
// exists). Not tied to scan completion: a tech can save whatever's been
// read so far, including after Stop.
function saveScan() {
  const zones = Object.keys(results).map(Number).sort((a, b) => a - b);
  if (!zones.length) { setStatus('No scan results to save yet.', true); return; }

  const rows = [['Zone', 'Type Code', 'Type Label', 'Name']];
  for (const zone of zones) {
    const r = results[zone];
    rows.push([zone, r.zone_type_code || '', r.zone_type_label || '', r.name || '']);
  }
  const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\r\n');
  const panelType = document.getElementById('panelType').value;
  const stamp = new Date().toISOString().replace(/[:.]/g, '-');

  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `vista-${panelType}-zones-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
  setStatus('Saved scan to CSV.');
}

function setToolsStatus(msg, isError) {
  const el = document.getElementById('toolsStatus');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// Persists the current results (whatever's been read so far, or loaded from
// a previous visit) to the backend under a site name, so "Load previous
// site" can bring it back later.
async function saveSite() {
  const name = document.getElementById('siteNameInput').value.trim();
  if (!name) { setToolsStatus('Enter a site name first.', true); return; }

  const panelType = document.getElementById('panelType').value;
  const zones = Object.values(results);
  try {
    const resp = await fetch(`/api/sites/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ panel_type: panelType, zones }),
    });
    if (!resp.ok) throw new Error(await resp.text());
    currentSiteName = name;
    setToolsStatus(`Saved "${name}".`);
  } catch (err) {
    setToolsStatus('Could not save site.', true);
  }
}

function setSiteListStatus(msg, isError) {
  const el = document.getElementById('siteListStatus');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

async function openLoadSite() {
  showScreen('loadSiteScreen');
  const listEl = document.getElementById('siteList');
  listEl.innerHTML = '';
  setSiteListStatus('Loading…');

  let sites;
  try {
    const resp = await fetch('/api/sites');
    sites = await resp.json();
  } catch (err) {
    setSiteListStatus('Could not load saved sites.', true);
    return;
  }

  if (!sites.length) { setSiteListStatus('No saved sites yet.'); return; }
  setSiteListStatus('');
  for (const site of sites) {
    const btn = document.createElement('button');
    btn.className = 'tool-card';
    const saved = new Date(site.saved_at).toLocaleString();
    const zoneWord = site.zone_count === 1 ? 'zone' : 'zones';
    btn.innerHTML = `${escapeHtml(site.name)}` +
      `<span class="sub">${escapeHtml(site.panel_type)} — ${site.zone_count} ${zoneWord} — saved ${escapeHtml(saved)}</span>`;
    btn.onclick = () => loadSite(site.name);
    listEl.appendChild(btn);
  }
}

// Selecting a saved site loads its last-saved scan data straight into the
// Zone Discovery table (skipping installer-code entry -- this is reviewing
// already-read data, not talking to a live panel) and drops the tech at
// the Tools menu.
async function loadSite(name) {
  let site;
  try {
    const resp = await fetch(`/api/sites/${encodeURIComponent(name)}`);
    if (!resp.ok) throw new Error('not found');
    site = await resp.json();
  } catch (err) {
    setSiteListStatus('Could not load that site.', true);
    return;
  }

  document.getElementById('panelType').value = site.panel_type;
  clearResults();
  for (const zone of site.zones) {
    results[zone.zone] = zone;
    const tr = row(zone.zone);
    if (zone.zone_type_label) tr.querySelector('.type').textContent = zone.zone_type_label;
    if (zone.name) tr.querySelector('.name').textContent = zone.name;
  }
  document.getElementById('saveBtn').disabled = site.zones.length === 0;

  currentSiteName = name;
  document.getElementById('siteNameInput').value = name;
  setToolsStatus(`Loaded "${name}".`);
  showScreen('toolsScreen');
}
</script>
</body>
</html>
