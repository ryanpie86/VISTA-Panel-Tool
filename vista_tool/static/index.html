<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Vista Panel Tool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, system-ui, sans-serif;
    background: #14161a; color: #e8eaed; height: 100vh; display: flex; flex-direction: column;
  }
  header { padding: 16px 20px; background: #1c1f26; border-bottom: 1px solid #2a2e37; }
  h1 { font-size: 18px; margin: 0; }
  main { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  input[type=text], input[type=password] {
    background: #1c1f26; border: 1px solid #2a2e37; color: #e8eaed;
    padding: 12px 14px; border-radius: 8px; font-size: 16px; flex: 1; min-width: 140px;
  }
  label { display: flex; align-items: center; gap: 6px; font-size: 15px; }
  button {
    background: #3a7bd5; color: white; border: none; border-radius: 8px;
    padding: 14px 20px; font-size: 16px; font-weight: 600; min-height: 48px;
  }
  button:disabled { opacity: 0.5; }
  button.stop { background: #d5453a; }
  #progressbar { height: 8px; background: #2a2e37; border-radius: 4px; overflow: hidden; margin: 14px 0; }
  #progressbar > div { height: 100%; background: #3a7bd5; width: 0%; transition: width 0.2s; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2e37; }
  th { color: #9aa0a8; font-weight: 500; font-size: 13px; text-transform: uppercase; }
  #status { color: #9aa0a8; font-size: 14px; margin-bottom: 8px; min-height: 20px; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<header><h1>Vista Panel Tool — Zone Discovery</h1></header>
<main>
  <div class="form-row">
    <input id="installerCode" type="password" placeholder="Installer code" inputmode="numeric">
    <label><input id="readTypes" type="checkbox" checked> Zone types (*56)</label>
    <label><input id="readNames" type="checkbox"> Zone names (*82, re-saves)</label>
  </div>
  <div class="form-row">
    <button id="startBtn" onclick="startScan()">Start Scan</button>
    <button id="stopBtn" class="stop" onclick="stopScan()" disabled>Stop</button>
  </div>
  <div id="status"></div>
  <div id="progressbar"><div id="progressfill"></div></div>
  <table>
    <thead><tr><th>Zone</th><th>Type</th><th>Name</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
</main>
<script>
let ws = null;
const results = {};

function row(zone) {
  let tr = document.getElementById('row-' + zone);
  if (!tr) {
    tr = document.createElement('tr');
    tr.id = 'row-' + zone;
    tr.innerHTML = `<td>${zone}</td><td class="type"></td><td class="name"></td>`;
    document.getElementById('results').appendChild(tr);
  }
  return tr;
}

function startScan() {
  const code = document.getElementById('installerCode').value.trim();
  if (!code) { setStatus('Enter the installer code first.', true); return; }
  document.getElementById('results').innerHTML = '';
  document.getElementById('startBtn').disabled = true;
  document.getElementById('stopBtn').disabled = false;
  setStatus('Connecting…');

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/scan`);
  ws.onopen = () => {
    ws.send(JSON.stringify({
      installer_code: code,
      read_types: document.getElementById('readTypes').checked,
      read_names: document.getElementById('readNames').checked,
    }));
    setStatus('Scanning…');
  };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.kind === 'progress') {
      if (msg.stage === 'error') { setStatus(msg.message, true); finishScan(); return; }
      if (msg.stage === 'done') { setStatus('Scan complete.'); finishScan(); return; }
      const pct = msg.total_zones ? Math.round(((msg.zone || 0) / msg.total_zones) * 100) : 0;
      document.getElementById('progressfill').style.width = pct + '%';
      setStatus(`Reading zone ${msg.zone} of ${msg.total_zones} (${msg.stage})…`);
    } else if (msg.kind === 'zone') {
      const tr = row(msg.zone);
      if (msg.zone_type_label) tr.querySelector('.type').textContent = msg.zone_type_label;
      if (msg.name) tr.querySelector('.name').textContent = msg.name;
    }
  };
  ws.onerror = () => setStatus('Connection error.', true);
  ws.onclose = () => finishScan();
}

function stopScan() { if (ws) ws.close(); finishScan(); }
function finishScan() {
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;
}
function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}
</script>
</body>
</html>
